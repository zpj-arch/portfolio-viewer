<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>作品集</title>
<style>
html,body{margin:0;padding:0;height:100%;font-family:"Microsoft YaHei",Arial,sans-serif}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0a0c16;color:#e9efff;gap:18px}
#loading .ring{width:44px;height:44px;border:3px solid #2b3040;border-top-color:#35e8ff;border-radius:50%;animation:spin 1s linear infinite}
#loading p{margin:0;font-size:14px;color:#8991aa}
#content{min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}
/* 兜底移动端适配：即使加载到的旧 HTML 没有这些样式，也能强制修复 */
@media(max-width:768px){
  #content .pub-profile{padding:0 16px !important}
  #content .pub-name{font-size:26px !important;line-height:1.3 !important}
  #content .pub-head{padding:24px 0 8px !important}
  #content .pub-avatar{width:min(60%,200px) !important;margin-bottom:14px !important}
  #content .pub-row{display:block !important;padding:14px 0 !important}
  #content .pub-row span{display:block !important;font-size:13px !important;margin-bottom:4px !important}
  #content .pub-row b{font-size:14px !important;line-height:1.7 !important}
  #content .pub-row b span{display:inline !important;font-size:14px !important;margin-bottom:0 !important}
  #content .pub-tpl{display:block !important}
  #content .pub-tpl .pub-tpl-col{display:flex !important;flex-wrap:wrap !important;gap:4px 10px !important;margin-bottom:8px !important}
  #content .pub-tpl .pub-tpl-col>b{white-space:normal !important;flex:none !important;font-size:13px !important}
  #content .pub-tpl .pub-tpl-col>span, #content .pub-tpl .pub-tpl-col>div, #content .pub-tpl .pub-tpl-col>em{white-space:normal !important;word-break:break-word !important;font-size:14px !important}
  #content .pub-tpl .pub-tpl-col span span{display:inline !important;font-size:14px !important;margin-bottom:0 !important}
  #content .pub-section-label{padding-left:16px !important;font-size:13px !important;margin:22px auto 10px !important}
  #content .pub-page{padding:0 0 8px !important}
  #content .pub-page img{max-width:100% !important;height:auto !important;display:block !important}
}
</style>
</head>
<body>
<div id="loading"><div class="ring"></div><p>作品集加载中，请稍候…</p></div>
<div id="content" style="display:none"></div>
<script>
(function(){
  var COS_BASE='https://my-portfolio-1467782956.cos-website.ap-guangzhou.myqcloud.com';
  var OWNER_UID='o_7f3a9c2e1b8d4a6f5c0e2b9d1a3f7c4e';
  var q=new URLSearchParams(location.search);
  var u=q.get('u')||q.get('ws')||OWNER_UID;
  // 加时间戳穿透浏览器与 CDN 缓存
  var COS_URL=COS_BASE+'/users/'+encodeURIComponent(u)+'/index.html?__t='+Date.now();
  var loading=document.getElementById('loading');
  var content=document.getElementById('content');
  var tried=0;
  var MAX_TRY=3;

  function applyMobileFix(){
    // 兜底：为已加载的内容再补一次移动端 class，确保旧 HTML 也能正确渲染
    var profile=content.querySelector('.pub-profile');
    if(profile){
      var style=profile.getAttribute('style')||'';
      if(style.indexOf('box-sizing')<0) profile.style.boxSizing='border-box';
    }
  }

  function load(){
    tried++;
    fetch(COS_URL,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.text();
    }).then(function(html){
      content.innerHTML=html;
      content.style.display='block';
      if(loading)loading.style.display='none';
      applyMobileFix();
      // 提取并执行脚本（兼容旧版页面）
      var scripts=content.querySelectorAll('script');
      scripts.forEach(function(oldScript){
        var newScript=document.createElement('script');
        if(oldScript.src){newScript.src=oldScript.src;}
        else{newScript.textContent=oldScript.textContent;}
        oldScript.parentNode.replaceChild(newScript,oldScript);
      });
    }).catch(function(err){
      console.error('Load error (try '+tried+'):',err);
      if(tried<MAX_TRY){
        setTimeout(load,800);
      }else{
        var p=loading.querySelector('p');
        if(p){
          p.innerHTML='作品集加载失败<br><span style="font-size:12px;color:#666">可能还没发布过，或网络暂时不稳定<br>请刷新页面重试</span>';
        }
        var ring=loading.querySelector('.ring');
        if(ring)ring.style.display='none';
      }
    });
  }

  // 8秒超时保护
  setTimeout(function(){
    if(content.style.display==='none' && tried>=MAX_TRY){
      var p=loading.querySelector('p');
      if(p)p.textContent='加载超时，请刷新页面重试';
    }
  },8000);

  load();
})();
</script>
</body>
</html>
